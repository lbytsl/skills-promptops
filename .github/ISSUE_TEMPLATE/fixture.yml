name: Fixture proposal / Fixture 提案
description: Contribute an anonymized Prompt failure mode / 贡献匿名化的 Prompt 失败模式
title: "[Fixture]: "
labels: ["fixture"]
body:
  - type: dropdown
    id: profile
    attributes:
      label: Profile / 场景类型
      options: [general, rag, agent, coding, structured-output, high-stakes]
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Anonymized prompt / 匿名化 Prompt
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Expected failure and rationale / 预期失败与理由
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type / 来源类型
      options: [synthetic, anonymized-real]
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License or permission / 许可证或授权
    validations:
      required: true
